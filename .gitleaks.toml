title = "Mellyn Security Gitleaks Configuration (OWASP AI & Cloud Secrets)"

# The default ruleset already covers OpenAI, Anthropic, GCP, HuggingFace, AWS, GitHub, and more.
# The rules below add LLM-ecosystem coverage and act as an explicit, reviewable inventory.
[extend]
useDefault = true

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key (sk-proj / sk-svcacct / legacy sk-)"
regex = '''sk-(?:proj|svcacct|None)-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{48}'''
keywords = ["sk-"]
tags = ["key", "openai", "llm"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic Claude API Key"
regex = '''sk-ant-(?:api|admin)\d{2}-[A-Za-z0-9_-]{80,120}'''
keywords = ["sk-ant-"]
tags = ["key", "anthropic", "llm"]

[[rules]]
id = "google-gemini-api-key"
description = "Google Gemini / GCP API Key"
regex = '''AIza[0-9A-Za-z_-]{35}'''
keywords = ["aiza"]
tags = ["key", "google", "gemini", "llm"]

[[rules]]
id = "huggingface-access-token"
description = "HuggingFace Access Token"
regex = '''hf_[A-Za-z0-9]{34,40}'''
keywords = ["hf_"]
tags = ["key", "huggingface", "llm"]

[[rules]]
id = "langsmith-api-key"
description = "LangChain / LangSmith API Key"
regex = '''lsv2_(?:pt|sk)_[a-f0-9]{32}_[a-f0-9]{8,16}'''
keywords = ["lsv2_"]
tags = ["key", "langsmith", "llm"]

# Allowlist by VALUE, not by file. .env.example, .gitleaks.toml, and test fixtures are still
# scanned because they are exactly where real keys get pasted by accident. A finding is
# ignored only if the matched secret contains an obvious placeholder word.
[allowlist]
description = "Obvious value placeholders only (no file-path exemptions)"
stopwords = ["example", "placeholder", "replace_with", "changeme", "dummy", "fake", "redacted", "xxxxxxxx"]
