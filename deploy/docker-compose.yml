# Mellyn Security — Self-Hosted Authorizer, MCP Gateway and Network Egress Proxy
#
# Networks:
#   - mellyn-internal (internal: true): no route to the internet. The MCP gateway and the MCP servers it
#     launches live here, so every outbound connection they make has to go through mellyn-egress, whether
#     or not a tool honours HTTPS_PROXY. A tool that ignores the proxy simply cannot connect.
#   - mellyn-egress-net: the only network with an internet route that carries agent traffic; only Squid is on it.
#   - mellyn-frontend: an ordinary bridge so the authorizer API's loopback port can be published (Docker does
#     not publish ports for containers that are only on internal networks). The authorizer makes no outbound
#     calls itself; no agent tool runs in its container.
#
# Quickstart (see deploy/README.md):
#   1. cp .env.example .env and fill in the pepper and key digests (python -m mellyn.credentials).
#   2. Export MELLYN_WORKSPACE=/absolute/path/to/the/agent/workspace (required; compose refuses to start without it).
#   3. Regenerate squid.conf whenever the policy changes:
#        PYTHONPATH=backend python -m mellyn.egress_proxy \
#          --policy config/mellyn-policy.example.toml --output deploy/egress/squid.conf
#   4. docker compose -f deploy/docker-compose.yml up -d --build          # authorizer API + egress proxy
#      The MCP gateway is started per client session by the MCP client itself (profile "gateway").

x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  mellyn-authorizer:
    <<: *hardening
    build:
      context: ..
      dockerfile: Dockerfile
    image: mellyn-security:local
    container_name: mellyn-authorizer
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MELLYN_POLICY_PATH: /etc/mellyn/mellyn-policy.example.toml
      MELLYN_WORKSPACE_ROOT: /workspace
      MELLYN_REQUIRE_WORKSPACE_MOUNT: "1"
      MELLYN_AUDIT_LOG_PATH: /var/log/mellyn/audit.jsonl
    ports:
      # Loopback only; put an internal TLS reverse proxy in front if other hosts must reach it.
      - "127.0.0.1:8000:8000"
    volumes:
      # The authorizer must see the same files the agent's tools see, or symlink/junction checks are blind.
      - ${MELLYN_WORKSPACE:?Set MELLYN_WORKSPACE to the absolute path of the agent workspace}:/workspace:ro
      - ../config:/etc/mellyn:ro
      - mellyn-audit-logs:/var/log/mellyn
    networks:
      - mellyn-frontend
    tmpfs:
      - /tmp:noexec,nosuid,size=64m

  mellyn-gateway:
    <<: *hardening
    profiles: ["gateway"]
    # Your MCP servers must be installed in this image. Build one FROM mellyn-security:local that adds them,
    # then set MELLYN_GATEWAY_IMAGE to it. The server commands come from config/mellyn-gateway.example.toml.
    image: ${MELLYN_GATEWAY_IMAGE:-mellyn-security:local}
    stdin_open: true
    command:
      - python
      - -m
      - mellyn.mcp_gateway
      - --config
      - /etc/mellyn/mellyn-gateway.example.toml
      - --workspace
      - /workspace
      - --audit-log
      - /var/log/mellyn/gateway-audit.jsonl
      - --approval-host
      - "0.0.0.0"
      - --approval-port
      - "8765"
    env_file:
      - ../.env
    environment:
      HTTPS_PROXY: http://mellyn-egress:3128
      HTTP_PROXY: http://mellyn-egress:3128
      NO_PROXY: ""
    volumes:
      - ${MELLYN_WORKSPACE:?Set MELLYN_WORKSPACE to the absolute path of the agent workspace}:/workspace
      - ../config:/etc/mellyn:ro
      - mellyn-audit-logs:/var/log/mellyn
    networks:
      mellyn-internal:
        aliases:
          - mellyn-gateway
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    healthcheck:
      disable: true # the image's HTTP health check is for the authorizer API
    depends_on:
      - mellyn-egress
      - mellyn-approval-relay

  mellyn-approval-relay:
    <<: *hardening
    profiles: ["gateway"]
    image: mellyn-security:local
    container_name: mellyn-approval-relay
    restart: unless-stopped
    command:
      - python
      - -m
      - mellyn.approval_relay
      - --listen-host
      - "0.0.0.0"
      - --listen-port
      - "8765"
      - --upstream-host
      - mellyn-gateway
      - --upstream-port
      - "8765"
    ports:
      # Host loopback only; forwards solely the 3 exact approval routes to mellyn-gateway on mellyn-internal.
      # Holds zero credentials (.env is not mounted).
      - "127.0.0.1:8765:8765"
    networks:
      - mellyn-frontend
      - mellyn-internal
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    healthcheck:
      disable: true

  mellyn-egress:
    <<: *hardening
    build:
      context: egress
      dockerfile: Dockerfile
    image: mellyn-egress:local
    container_name: mellyn-egress
    restart: unless-stopped
    volumes:
      - ./egress/squid.conf:/etc/squid/squid.conf:ro
    networks:
      mellyn-internal:
      mellyn-egress-net:
    tmpfs:
      # uid/gid 13 is the Ubuntu `proxy` user Squid runs as.
      - /tmp:noexec,nosuid,size=64m,uid=13,gid=13
      - /var/spool/squid:noexec,nosuid,size=64m,uid=13,gid=13
      - /var/log/squid:noexec,nosuid,size=64m,uid=13,gid=13

networks:
  mellyn-internal:
    internal: true
    ipam:
      config:
        # Must match --client-cidr in squid.conf (python -m mellyn.egress_proxy --client-cidr ...).
        - subnet: 172.30.250.0/24
  mellyn-egress-net:
    driver: bridge
  mellyn-frontend:
    driver: bridge

volumes:
  mellyn-audit-logs:
