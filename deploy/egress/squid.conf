# GENERATED FILE — Mellyn Security Network Egress Proxy (Squid)
# Regenerate from policy: python -m mellyn.egress_proxy --policy <policy.toml> --output deploy/egress/squid.conf
#
# Enforces Threat Model TM-02 at the network layer:
#   1. HTTPS CONNECT on port 443 only (no plaintext HTTP, no arbitrary ports).
#   2. Blocks all RFC1918, loopback, CGNAT, cloud-metadata (169.254.169.254), and IPv6 ULA/link-local
#      destinations AFTER DNS resolution to defeat DNS rebinding.
#   3. Denies direct IP literals and every domain not explicitly allowlisted.

http_port 3128
pid_filename /tmp/squid.pid
coredump_dir /tmp
pinger_enable off
cache deny all
cache_log stdio:/dev/stderr
access_log stdio:/dev/stdout squid
via off
forwarded_for delete
httpd_suppress_version_string on

# Only the internal agent network may use the proxy
acl mellyn_clients src 172.30.250.0/24
http_access deny !mellyn_clients

# Restrict allowed ports and methods strictly to HTTPS tunneling (CONNECT :443)
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny !CONNECT
http_access deny !SSL_ports

# Reject raw IPv4/IPv6 literals in the request host
acl raw_ip_host url_regex -i ^([0-9]{1,3}\.){3}[0-9]{1,3}(:[0-9]+)?$ ^\[?[0-9a-f:]+\]?(:[0-9]+)?$
http_access deny raw_ip_host

# Block private, loopback, link-local, and cloud-metadata IPs at connect time (anti-DNS-rebinding)
acl blocked_dst dst 0.0.0.0/8
acl blocked_dst dst 10.0.0.0/8
acl blocked_dst dst 100.64.0.0/10
acl blocked_dst dst 127.0.0.0/8
acl blocked_dst dst 169.254.0.0/16
acl blocked_dst dst 172.16.0.0/12
acl blocked_dst dst 192.168.0.0/16
acl blocked_dst dst 224.0.0.0/4
acl blocked_dst dst 240.0.0.0/4
acl blocked_dst dst ::1/128
acl blocked_dst dst fc00::/7
acl blocked_dst dst fe80::/10
acl blocked_dst dst ff00::/8
http_access deny blocked_dst

# Policy-synced domain allowlist (exact domain and subdomains)
acl allowed_domains dstdomain .api.github.com
acl allowed_domains dstdomain .docs.python.org
http_access allow CONNECT SSL_ports allowed_domains

# Default deny everything else (fail closed)
http_access deny all
