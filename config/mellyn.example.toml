# Mellyn Security — Example Unified Configuration (schema_version = 2)
# Combines runtime mode, Squid egress allowlist, obfuscated canary/secret scanner, tool-call policy, and
# downstream MCP servers into a single GitOps-managed file (`mellyn proxy --config config/mellyn.example.toml`).
#
# Quickstart:
#   mellyn init --unified --preset mcp-filesystem --preset github
#   mellyn pin --name local-workspace --preset mcp-filesystem --config config/mellyn.toml -- <cmd>
#   mellyn proxy --config config/mellyn.toml --workspace .

schema_version = 2

[runtime]
mode = "enforce"
allow_observe_mode = false
audit_log = "mellyn-audit.jsonl"
state_db = "mellyn-state.sqlite3"

[egress]
allowed_domains = ["docs.python.org"]
auto_sync_squid = true

[scanner]
canary_tokens = []
block_known_secrets = true
aad_kill_on_leak = true
blocked_patterns = []
detect_high_entropy = false

[policy]
protected_paths = []
injection_escalate_threshold = 0.70
injection_deny_threshold = 0.90
deny_on_dlp_secret = true

[[policy.scoped_rules]]
rule_id = "deny-destructive-programs"
tool_name = "shell_exec"
effect = "deny"
programs = ["rm", "curl", "wget", "nc", "ncat"]
description = "Defense-in-depth denial of destructive deletion and raw network binaries."

[[servers]]
name = "local-workspace"
transport = "stdio"
preset = "mcp-filesystem"
trusted = true
command = ["replace-with-your-workspace-mcp-server", "--root", "."]
# Run `mellyn pin --name local-workspace --preset mcp-filesystem --config config/mellyn.toml -- <cmd>`
# to record the reviewed 64-char `tools_sha256` manifest digest and detect rug pulls at startup.

[[servers]]
name = "github"
transport = "stdio"
preset = "github"
trusted = false
command = ["replace-with-your-github-mcp-server", "--read-only"]
# Downstream stdio servers get only a minimal environment (PATH, HOME, locale, temp, proxy, and the Windows
# system and app-data variables). Name anything else a server needs, such as its API token, in `pass_env`.
# MELLYN_* variables, OAuth secrets, and code-injection variables (LD_PRELOAD, NODE_OPTIONS, ...) are never passed.
pass_env = ["GITHUB_PERSONAL_ACCESS_TOKEN"]

# Optional remote Streamable HTTP MCP server with OAuth 2.1 (M2M or PKCE). Its URL and OAuth hosts are allowed for
# the gateway only (and in Squid), never added to the tool egress allowlist; the *_env secrets it names are withheld
# from downstream MCP servers:
# [[servers]]
# name = "remote-github"
# transport = "streamable-http"
# url = "https://api.githubcopilot.com/mcp/"
# preset = "github"
# trusted = false
# tools_sha256 = "replace-with-mellyn-pin-digest"
#
# [servers.oauth]
# flow = "pkce"
# allowed_authorization_servers = ["https://github.com/login/oauth"]
# client_id_env = "GITHUB_OAUTH_CLIENT_ID"
# scopes = ["repo"]  # request only what the tools need
# token_cache_path = "/var/lib/mellyn/oauth/remote-github.json"  # one per server, never inside the workspace
