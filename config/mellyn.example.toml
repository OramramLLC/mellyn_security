# Mellyn Security — Example Unified Configuration (schema_version = 2)
# Combines runtime mode, Squid egress allowlist, obfuscated canary/secret scanner, tool-call policy, and
# downstream MCP servers into a single GitOps-managed file (`mellyn proxy --config config/mellyn.example.toml`).
#
# Quickstart:
#   mellyn init --unified --preset mcp-filesystem --preset github
#   mellyn pin --name local-workspace --preset mcp-filesystem --config config/mellyn.toml -- <cmd>
#   mellyn proxy --config config/mellyn.toml --workspace .

schema_version = 2

[runtime]
mode = "enforce"
allow_observe_mode = false
audit_log = "mellyn-audit.jsonl"
state_db = "mellyn-state.sqlite3"

[egress]
allowed_domains = ["docs.python.org"]
auto_sync_squid = true

[scanner]
canary_tokens = []
block_known_secrets = true
aad_kill_on_leak = true
blocked_patterns = []

[policy]
protected_paths = []
injection_escalate_threshold = 0.70
injection_deny_threshold = 0.90
deny_on_dlp_secret = true

[[policy.scoped_rules]]
rule_id = "deny-destructive-programs"
tool_name = "shell_exec"
effect = "deny"
programs = ["rm", "curl", "wget", "nc", "ncat"]
description = "Defense-in-depth denial of destructive deletion and raw network binaries."

[[servers]]
name = "local-workspace"
transport = "stdio"
preset = "mcp-filesystem"
trusted = true
command = ["replace-with-your-workspace-mcp-server", "--root", "."]
# Run `mellyn pin --name local-workspace --preset mcp-filesystem --config config/mellyn.toml -- <cmd>`
# to record the reviewed 64-char `tools_sha256` manifest digest and detect rug pulls at startup.

[[servers]]
name = "github"
transport = "stdio"
preset = "github"
trusted = false
command = ["replace-with-your-github-mcp-server", "--read-only"]

# Optional remote Streamable HTTP MCP server with OAuth 2.1 (M2M or PKCE):
# [[servers]]
# name = "remote-github"
# transport = "streamable-http"
# url = "https://api.githubcopilot.com/mcp/"
# preset = "github"
# trusted = false
# tools_sha256 = "replace-with-mellyn-pin-digest"
#
# [servers.oauth]
# flow = "pkce"
# allowed_authorization_servers = ["https://github.com/login/oauth"]
# client_id_env = "GITHUB_OAUTH_CLIENT_ID"
# scopes = ["repo"]  # request only what the tools need
# token_cache_path = "/var/lib/mellyn/oauth/remote-github.json"  # one per server, never inside the workspace

# Optional OAuth 2.1 / OIDC authentication for upstream Streamable HTTP (`mellyn serve`; defaults to `hmac`):
# [auth]
# mode = "oidc"
# issuer = "https://accounts.google.com"
# audience = "https://mellyn.company.internal/mcp"
# required_scopes = ["mellyn:tools"]  # the agent's token for /mcp
# # Approvals need a separate token carrying an approver scope; /mcp refuses it, and the approval server refuses
# # agent tokens. approver_subjects (matched on `sub`, never email) or approver_groups narrow who may hold one.
# approver_scopes = ["mellyn:approve"]
# approver_groups = ["security-approvers"]
# allowed_origins = ["https://console.mellyn.company.internal"]

# Optional outbound redacted approval webhook alerts (Slack / Teams / generic JSON). The webhook URL is a credential,
# so it is read from the environment (never this file) and withheld from downstream MCP servers. webhook_host is the
# only host alerts may go to; it is reachable by the gateway (and via Squid) but is not added to the tool egress
# allowlist, so tools cannot post to other webhooks on the same shared host.
# [notifications]
# approval_webhook_url_env = "SLACK_WEBHOOK_URL"
# webhook_host = "hooks.slack.com"
# webhook_format = "auto"
# console_base_url = "https://mellyn.company.internal"
# timeout_seconds = 5.0
