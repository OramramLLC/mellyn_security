name: Mellyn Security — Reusable OWASP AI Coding Security Gate

on:
  workflow_call:
    inputs:
      min-package-age-days:
        description: "Minimum PyPI/npm package age in days before flagging as potential slopsquatting"
        required: false
        type: number
        default: 90
      check-agent-rules:
        description: "Check AI instruction files for hidden Unicode (and for drift, if .agent/rules is used)"
        required: false
        type: boolean
        default: true
      run-semgrep:
        description: "Run Mellyn Security OWASP AI-assisted coding Semgrep rules"
        required: false
        type: boolean
        default: true
      run-gitleaks:
        description: "Run Gitleaks secret scanning with AI + cloud credential rules"
        required: false
        type: boolean
        default: true
      python-version:
        description: "Python version for running security checks"
        required: false
        type: string
        default: "3.12"

# Least privilege: nothing in this reusable workflow writes to the caller's repository.
permissions:
  contents: read

# Design rules for this workflow:
# - Third-party actions are pinned to full commit SHAs; Gitleaks is SHA-256 verified by scripts/ci_guardrails.py.
# - Python scanner dependencies are installed with `--require-hashes --no-deps` from deploy/requirements-ci-scanners.lock.
# - The caller's code is checked out to `caller/` and Mellyn's guardrails to `mellyn/`, side by side, so the code
#   under review can never stand in for (or overwrite) the scripts, rules and configs that review it.
# - The guardrails come from `job.workflow_repository` at `job.workflow_sha`: the repository and commit of THIS
#   workflow file. (`github.*` in a called workflow describes the caller, so `github.workflow_sha` would check out
#   the caller's own commit.) The `job.workflow_*` context is not available on GitHub Enterprise Server.
# - Nothing in the code under review can switch the scanners off: `# nosemgrep` and `# gitleaks:allow` comments
#   are ignored, and the caller's `.semgrepignore` / `.gitleaksignore` files are replaced or bypassed.
# - No `${{ }}` expression appears inside a `run:` script; values reach scripts through `env:`.

jobs:
  secrets:
    if: ${{ inputs.run-gitleaks }}
    name: Mellyn Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve the Mellyn guardrails source
        env:
          MELLYN_REPO: ${{ job.workflow_repository }}
          MELLYN_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$MELLYN_REPO" ] || ! printf '%s' "$MELLYN_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not determine this workflow's own repository and commit (job.workflow_*); refusing to run."
            exit 1
          fi
          echo "Guardrails: $MELLYN_REPO@$MELLYN_SHA"

      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Mellyn Security guardrails (this workflow's own commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: mellyn
          sparse-checkout: |
            .gitleaks.toml
            scripts
          persist-credentials: false

      - name: Install pinned Gitleaks and scan caller commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 mellyn/scripts/ci_guardrails.py install-gitleaks --dest-dir "$RUNNER_TEMP/gitleaks-bin"
          python3 mellyn/scripts/ci_guardrails.py run-gitleaks \
            --gitleaks-bin "$RUNNER_TEMP/gitleaks-bin/gitleaks" \
            --target caller \
            --guardrails mellyn \
            --mode caller-range

  supply-chain-and-sast:
    name: Mellyn Supply-Chain & OWASP AI SAST Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the Mellyn guardrails source
        env:
          MELLYN_REPO: ${{ job.workflow_repository }}
          MELLYN_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$MELLYN_REPO" ] || ! printf '%s' "$MELLYN_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not determine this workflow's own repository and commit (job.workflow_*); refusing to run."
            exit 1
          fi
          echo "Guardrails: $MELLYN_REPO@$MELLYN_SHA"

      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          fetch-depth: 2
          persist-credentials: false

      - name: Checkout Mellyn Security guardrails (this workflow's own commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: mellyn
          sparse-checkout: |
            .semgrep
            deploy
            scripts
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Verify dependencies (existence, package age, pinning, registry-only)
        env:
          MELLYN_MIN_AGE_DAYS: ${{ inputs.min-package-age-days }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          allowlist="$RUNNER_TEMP/mellyn-allowlist.toml"
          python mellyn/scripts/ci_guardrails.py extract-allowlist \
            --repo caller \
            --output "$allowlist" \
            --event-name "$EVENT_NAME"
          python mellyn/scripts/verify_dependencies.py \
            --root caller \
            --online \
            --min-age-days "$MELLYN_MIN_AGE_DAYS" \
            --allowlist "$allowlist"

      - name: Check AI instruction files for hidden Unicode and drift
        if: ${{ inputs.check-agent-rules }}
        run: python mellyn/scripts/sync_agent_rules.py --check --root caller

      - name: Install hash-locked Semgrep
        if: ${{ inputs.run-semgrep }}
        run: >
          python -m pip install --disable-pip-version-check --require-hashes --no-deps
          -r mellyn/deploy/requirements-ci-scanners.lock

      - name: Semgrep scan with Mellyn OWASP AI rules (suppressions disabled)
        if: ${{ inputs.run-semgrep }}
        run: python mellyn/scripts/ci_guardrails.py run-semgrep --target caller --guardrails mellyn
