name: Mellyn Security — Reusable OWASP AI Coding Security Gate

on:
  workflow_call:
    inputs:
      min-package-age-days:
        description: "Minimum PyPI/npm package age in days before flagging as potential slopsquatting"
        required: false
        type: number
        default: 90
      check-agent-rules:
        description: "Check AI instruction files for hidden Unicode (and for drift, if .agent/rules is used)"
        required: false
        type: boolean
        default: true
      run-semgrep:
        description: "Run Mellyn Security OWASP AI-assisted coding Semgrep rules"
        required: false
        type: boolean
        default: true
      run-gitleaks:
        description: "Run Gitleaks secret scanning with AI + cloud credential rules"
        required: false
        type: boolean
        default: true
      python-version:
        description: "Python version for running security checks"
        required: false
        type: string
        default: "3.12"

# Least privilege: nothing in this reusable workflow writes to the caller's repository.
permissions:
  contents: read

# Design rules for this workflow:
# - Third-party actions are pinned to full commit SHAs; the Gitleaks binary is pinned by version and SHA-256.
# - The caller's code is checked out to `caller/` and Mellyn's guardrails to `mellyn/`, side by side, so the code
#   under review can never stand in for (or overwrite) the scripts, rules and configs that review it.
# - The guardrails come from `job.workflow_repository` at `job.workflow_sha`: the repository and commit of THIS
#   workflow file. (`github.*` in a called workflow describes the caller, so `github.workflow_sha` would check out
#   the caller's own commit.) The `job.workflow_*` context is not available on GitHub Enterprise Server.
# - Nothing in the code under review can switch the scanners off: `# nosemgrep` and `# gitleaks:allow` comments
#   are ignored, and the caller's `.semgrepignore` / `.gitleaksignore` files are not used.
# - No `${{ }}` expression appears inside a `run:` script; values reach scripts through `env:`.

jobs:
  secrets:
    if: ${{ inputs.run-gitleaks }}
    name: Mellyn Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve the Mellyn guardrails source
        env:
          MELLYN_REPO: ${{ job.workflow_repository }}
          MELLYN_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$MELLYN_REPO" ] || ! printf '%s' "$MELLYN_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not determine this workflow's own repository and commit (job.workflow_*); refusing to run."
            exit 1
          fi
          echo "Guardrails: $MELLYN_REPO@$MELLYN_SHA"

      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Mellyn Security guardrails (this workflow's own commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: mellyn
          sparse-checkout: |
            .gitleaks.toml
          persist-credentials: false

      - name: Install pinned Gitleaks (checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Run Gitleaks with Mellyn AI & cloud secret rules
        working-directory: caller
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          is_sha() { printf '%s' "$1" | grep -Eq '^[0-9a-f]{40}$' && [ "$1" != "0000000000000000000000000000000000000000" ]; }
          range=""
          if [ "$EVENT_NAME" = "pull_request" ] && is_sha "$PR_BASE_SHA" && is_sha "$PR_HEAD_SHA"; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ] && is_sha "$PUSH_BEFORE_SHA" && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE_SHA..$COMMIT_SHA"
          fi
          echo "Scanning ${range:-full history}"
          # The code under review must not allowlist itself. Gitleaks reads .gitleaksignore from --gitleaks-ignore-path
          # AND from the root of the scanned directory, so point the flag at an empty directory and delete the file.
          rm -f .gitleaksignore
          mkdir -p "$RUNNER_TEMP/no-gitleaksignore"
          set -- git . --config ../mellyn/.gitleaks.toml --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$RUNNER_TEMP/no-gitleaksignore" --redact --no-banner --exit-code 1
          if [ -n "$range" ]; then set -- "$@" --log-opts="$range"; fi
          "$RUNNER_TEMP/gitleaks" "$@"

  supply-chain-and-sast:
    name: Mellyn Supply-Chain & OWASP AI SAST Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the Mellyn guardrails source
        env:
          MELLYN_REPO: ${{ job.workflow_repository }}
          MELLYN_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$MELLYN_REPO" ] || ! printf '%s' "$MELLYN_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not determine this workflow's own repository and commit (job.workflow_*); refusing to run."
            exit 1
          fi
          echo "Guardrails: $MELLYN_REPO@$MELLYN_SHA"

      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          persist-credentials: false

      - name: Checkout Mellyn Security guardrails (this workflow's own commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: mellyn
          sparse-checkout: |
            .semgrep
            scripts
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Verify dependencies (existence, package age, pinning, registry-only)
        working-directory: caller
        env:
          MELLYN_MIN_AGE_DAYS: ${{ inputs.min-package-age-days }}
        run: python ../mellyn/scripts/verify_dependencies.py --online --min-age-days "$MELLYN_MIN_AGE_DAYS"

      - name: Check AI instruction files for hidden Unicode and drift
        if: ${{ inputs.check-agent-rules }}
        working-directory: caller
        run: python ../mellyn/scripts/sync_agent_rules.py --check

      - name: Install pinned Semgrep
        if: ${{ inputs.run-semgrep }}
        run: python -m pip install --disable-pip-version-check "semgrep==1.182.0"

      - name: Replace caller-controlled Semgrep ignore files
        if: ${{ inputs.run-semgrep }}
        working-directory: caller
        run: |
          # .semgrepignore files (at any depth) are part of the code under review; a PR could add one to hide itself.
          find . -name .semgrepignore -not -path './.git/*' -print -delete
          printf '%s\n' 'node_modules/' '.venv/' 'venv/' 'vendor/' 'dist/' 'build/' '*.min.js' > .semgrepignore

      - name: Semgrep scan with Mellyn OWASP AI rules
        if: ${{ inputs.run-semgrep }}
        working-directory: caller
        run: >
          semgrep scan
          --config ../mellyn/.semgrep/owasp-ai-code-rules.yaml
          --disable-nosem
          --error
          --metrics=off
