name: OWASP AI-Assisted Coding Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing in this workflow writes to the repository or uploads results.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (tags can be moved; see the
# tj-actions/changed-files compromise). Python tools are pinned to exact versions.
# Bump both deliberately, e.g. with Dependabot or `pre-commit autoupdate --freeze`.

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The Gitleaks CLI rather than gitleaks-action, so `# gitleaks:allow` comments and a .gitleaksignore added by
      # the change under review are not honored. Pinned by version and SHA-256 of the release archive.
      - name: Install pinned Gitleaks (checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Gitleaks (full history, suppressions ignored)
        run: |
          # Gitleaks reads .gitleaksignore from --gitleaks-ignore-path AND from the scanned directory's root.
          rm -f .gitleaksignore
          mkdir -p "$RUNNER_TEMP/no-gitleaksignore"
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$RUNNER_TEMP/no-gitleaksignore" --redact --no-banner --exit-code 1

  sast-and-supply-chain:
    name: SAST, lint, agent rules & dependency verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned security tooling
        run: python -m pip install --disable-pip-version-check "semgrep==1.182.0" "ruff==0.17.1"

      - name: Verify dependencies (existence, age, pinning, non-registry sources)
        run: python scripts/verify_dependencies.py --online

      - name: Check agent rules files are in sync and free of hidden characters
        run: python scripts/sync_agent_rules.py --check

      - name: Ruff (lint, including bandit security rules)
        run: ruff check .

      - name: Test the custom Semgrep rules
        working-directory: .semgrep # semgrep --test skips dot-directories when run from the root
        run: semgrep --test --metrics=off .

      - name: Replace Semgrep ignore files (the change under review must not be able to hide itself)
        run: |
          find . -name .semgrepignore -not -path './.git/*' -print -delete
          printf '%s\n' 'node_modules/' '.venv/' 'venv/' 'vendor/' 'dist/' 'build/' '*.min.js' > .semgrepignore

      - name: Semgrep scan with OWASP AI rules
        run: >
          semgrep scan --config .semgrep/owasp-ai-code-rules.yaml --exclude .semgrep
          --disable-nosem --error --metrics=off

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # API test dependencies live in this job only: current FastAPI needs a newer opentelemetry-api than
      # the Semgrep pin in the job above allows. Versions are at least a month old as a supply-chain cooldown;
      # starlette is pinned too so the transitive dependency cannot float to a brand-new release.
      - name: Install pinned API test dependencies
        run: python -m pip install --disable-pip-version-check "fastapi==0.159.1" "starlette==1.9.0" "httpx==0.28.1"

      - name: Run tests
        env:
          AEGIS_REQUIRE_API_TESTS: "1" # fail instead of skipping if the API test dependencies are missing
        run: python -m unittest discover -s tests -v
