name: Mellyn Security CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: read-only repository token.
permissions:
  contents: read

# Security design:
# - Third-party actions are pinned to full 40-char commit SHAs.
# - Gitleaks, Semgrep, hidden-Unicode/rules sync (with --require-pack-canonical), and dependency/anti-slopsquatting
#   verification run inside the SHA-pinned `OramramLLC/mellyn-guardrails` reusable workflow.
# - Baseline Ruff enforcement runs on `candidate/` using `pyproject.toml` and `deploy/requirements-ci-lint.lock`
#   checked out from `baseline/` (target `main` commit) with `--require-hashes --no-deps`.
# - Required wrapper/gate jobs report the exact four status check names required by the `main` ruleset.

jobs:
  guardrails:
    name: Mellyn Guardrails
    uses: OramramLLC/mellyn-guardrails/.github/workflows/mellyn-reusable-ai-security-gate.yml@21c719e49137c4f7cd2857f073528bbb436f5a07
    with:
      require-pack-rules: true

  secrets:
    # Keep this name: the `main` ruleset requires a check with exactly this name.
    name: Secret scan (Gitleaks)
    needs: [guardrails]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Mellyn Guardrails secret scan passed
        env:
          GUARDRAILS_RESULT: ${{ needs.guardrails.result }}
        run: |
          if [ "$GUARDRAILS_RESULT" != "success" ]; then
            echo "::error::Mellyn Guardrails reusable workflow did not succeed (result=$GUARDRAILS_RESULT)."
            exit 1
          fi

  sast-and-supply-chain:
    # Keep this name: the `main` ruleset requires a check with exactly this name.
    name: SAST, lint, agent rules & dependency verification
    needs: [guardrails]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Mellyn Guardrails SAST, rules, and dependency checks passed
        env:
          GUARDRAILS_RESULT: ${{ needs.guardrails.result }}
        run: |
          if [ "$GUARDRAILS_RESULT" != "success" ]; then
            echo "::error::Mellyn Guardrails reusable workflow did not succeed (result=$GUARDRAILS_RESULT)."
            exit 1
          fi

      - name: Checkout candidate tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false

      - name: Checkout baseline Ruff config and lint lockfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: baseline
          sparse-checkout: |
            deploy/requirements-ci-lint.lock
            pyproject.toml
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hash-locked Ruff
        run: |
          lock="baseline/deploy/requirements-ci-lint.lock"
          if [ ! -f "$lock" ]; then lock="candidate/deploy/requirements-ci-lint.lock"; fi
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r "$lock"

      # With --config, Ruff ignores every pyproject.toml/ruff.toml in the candidate (so a PR cannot add
      # per-file-ignores for its own code) and resolves the config's relative paths from the working directory.
      - name: Ruff (lint & format check on candidate, with the baseline configuration)
        working-directory: candidate
        run: |
          ruff check --config ../baseline/pyproject.toml .
          ruff format --check --config ../baseline/pyproject.toml .

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hash-locked API test dependencies
        run: >
          python -m pip install --disable-pip-version-check --require-hashes --no-deps
          -r deploy/requirements-ci-tests.lock

      - name: Run tests
        env:
          MELLYN_REQUIRE_API_TESTS: "1"
        run: python -m unittest discover -s tests -v

  container-and-egress:
    name: Container build & Squid egress integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build digest-pinned images and verify Squid egress and private-address blocking
        run: python scripts/verify_container_stack.py
