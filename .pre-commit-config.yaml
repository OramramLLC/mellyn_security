# Hook repos are pinned to commit SHAs. To upgrade, run: pre-commit autoupdate --freeze
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/semgrep/semgrep
    rev: 240da9f30cd06fb4ee00c2c31c114c1c1f5ee0f4 # frozen: v1.182.0
    hooks:
      - id: semgrep
        args: ["--config", ".semgrep/owasp-ai-code-rules.yaml", "--error", "--metrics=off"]
        exclude: ^\.semgrep/ # rule test fixtures are intentionally insecure

  # language: python runs each hook in a pre-commit-managed virtualenv, so "python" resolves
  # correctly on Windows even when the bare command opens the Microsoft Store stub.
  - repo: local
    hooks:
      - id: owasp-ai-dependency-verifier
        name: Dependency & anti-slopsquatting verifier
        entry: python scripts/verify_dependencies.py
        language: python
        pass_filenames: false
        files: (^|/)(pyproject\.toml|requirements.*\.(txt|lock)|uv\.lock|package(-lock)?\.json|\.mellyn-allowlist\.toml|scripts/verify_dependencies\.py)$

      - id: agent-rules-sync
        name: Agent rules files in sync, no hidden characters
        entry: python scripts/sync_agent_rules.py --check
        language: python
        pass_filenames: false
        files: ^(CLAUDE\.md|AGENTS\.md|GEMINI\.md|\.cursorrules|\.windsurfrules|\.clinerules|\.agent/.*|\.cursor/rules/.*|\.github/(copilot-instructions\.md|instructions/.*)|config/mellyn-(policy\.example|self-policy)\.toml|scripts/sync_agent_rules\.py)$

      - id: unit-tests
        name: Unit tests
        entry: python -m unittest discover -s tests
        language: python
        pass_filenames: false
        files: ^(scripts|tests|backend)/.*\.py$
