# Hook repos are pinned to commit SHAs. To upgrade, run: pre-commit autoupdate --freeze
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/OramramLLC/mellyn-guardrails
    rev: 06b620b70ea5c46b105f6a0a41dc7c3a5191d3a5
    hooks:
      - id: mellyn-verify-dependencies
      - id: mellyn-check-agent-rules
        args: [--check, --require-pack-canonical]
      - id: mellyn-gitleaks
      - id: mellyn-semgrep

  # language: python runs the test hook in a pre-commit-managed virtualenv, so "python" resolves
  # correctly on Windows even when the bare command opens the Microsoft Store stub.
  - repo: local
    hooks:
      - id: unit-tests
        name: Unit tests
        entry: python -m unittest discover -s tests
        language: python
        pass_filenames: false
        files: ^(scripts|tests|backend|src)/.*\.py$
