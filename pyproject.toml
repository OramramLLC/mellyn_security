[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mellyn-security"
version = "1.0.0"
description = "OWASP-aligned AI Security Engineering Reference Architecture & B2B Guardrail Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "AI Security Engineering" }
]
dependencies = [
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
gateway = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
]
# EC (ES256/384/512) and EdDSA ID-provider keys for `mellyn serve` OIDC; RSA keys need only the standard library.
oidc = [
    "cryptography>=50.0.2",
]
dev = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
    "cryptography>=50.0.2",
    "pytest>=8.3.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]

[project.scripts]
mellyn = "mellyn.cli:main"
mellyn-airlock = "mcp_airlock.airlock.proxy:main"
mellyn-pin = "mcp_airlock.airlock.pin_cli:main"
mellyn-ir = "mcp_airlock.ir_lab.reconstruct:main"
mellyn-bench = "mcp_airlock.egress.bench:main"

[tool.setuptools]
packages = [
    "mcp_airlock",
    "mcp_airlock.core",
    "mcp_airlock.egress",
    "mcp_airlock.airlock",
    "mcp_airlock.ir_lab",
    "mellyn",
]

[tool.setuptools.package-dir]
mcp_airlock = "src/mcp_airlock"
mellyn = "backend/mellyn"

[tool.ruff]
line-length = 120
target-version = "py312"
# Intentionally insecure Semgrep rule fixtures, at the repository root only: a bare ".semgrep" would also skip a
# `.semgrep/` directory at any depth, a place to hide code from the linter.
extend-exclude = ["./.semgrep"]

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "scripts", "src"]
