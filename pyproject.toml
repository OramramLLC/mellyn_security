[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mellyn-security"
version = "0.1.0"
description = "OWASP-aligned AI Security Engineering Reference Architecture & B2B Guardrail Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "AI Security Engineering" }
]
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Intentionally insecure Semgrep rule fixtures, at the repository root only: a bare ".semgrep" would also skip a
# `.semgrep/` directory at any depth, a place to hide code from the linter.
extend-exclude = ["./.semgrep"]

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "scripts"]
