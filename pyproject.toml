[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mellyn-security"
version = "1.0.0"
description = "OWASP-aligned AI Security Engineering Reference Architecture & B2B Guardrail Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "AI Security Engineering" }
]
dependencies = [
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
gateway = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
]
dev = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]

[project.scripts]
mellyn = "mellyn.cli:main"
mellyn-airlock = "mellyn.airlock.proxy:main"
mellyn-pin = "mellyn.airlock.pin_cli:main"
mellyn-ir = "mellyn.ir_lab.reconstruct:main"
mellyn-bench = "mellyn.egress.bench:main"

[tool.setuptools]
packages = [
    "mellyn",
    "mellyn.core",
    "mellyn.egress",
    "mellyn.airlock",
    "mellyn.ir_lab",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "src"]
